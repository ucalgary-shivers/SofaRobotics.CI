name: Build release

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * SUN' 

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
    GH_TOKEN: ${{ github.token }}

jobs:
  build:
    name: Build on ${{matrix.os}} ${{matrix.emscripten == 'true' && '(emscripten)' || '' }}
    runs-on: ${{matrix.os}}
    permissions: 
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04] # [ubuntu-22.04, windows-2025, macos-15]
        emscripten: ['true'] # ['true', 'false']
        # exclude:
        #   - os: ubuntu-22.04
        #     emscripten: 'true'
        #   - os: windows-2025
        #     emscripten: 'true'

    steps:
      # Checks-out the repository under $GITHUB_WORKSPACE, so the job can access it
      - uses: actions/checkout@v4

      - name: Initialize MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        if: matrix.os == 'windows-2025'
        with:
          arch: x64

      - name: Build SOFA-Robotics
        uses: ./
        with:
          os: ${{matrix.os}}
          sofa_target: emscripten
          sofa_version: main-unstable
          use_emscripten: ${{matrix.emscripten}}

  deploy-preview:
    # run only from pull requests
    if: github.event_name == 'pull_request' && contains(fromJSON('["opened", "reopened", "synchronize"]'), github.event.action) 
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          pattern: SOFA-Robotics_*_emscripten*
          path: ./artifact
      - name: Extract artifact
        run: |
          ls -a ./artifact
          ls -a ./artifact/SOFA-Robotics*
          mkdir -p ./distribution
          unzip -o ./artifact/SOFA-Robotics*/SOFA-Robotics*.zip -d ./distribution || echo "Nothing to extract"
          ls -a ./distribution
      - name: Cleanup distribution
        run: |
          ls -a
          cd ./distribution/SOFA-Robotics*
          rm -fr bin/python || echo "No python distribution to cleanup"
          mv bin/*.* ..
          mv lib/*.* ..
          echo Skipping plugins to save github pages space until loading libraries works
          # mv plugins ..
          cd ..
          rm -fr SOFA-Robotics*
          ls -a
      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./distribution

  remove-preview:
    # run only from pull requests
    if: github.event_name == 'pull_request' && contains('closed', github.event.action) 
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Remove preview
        uses: rossjrw/pr-preview-action@v1
        with:
          action: remove

  release:
    name: Create Release
    runs-on: ubuntu-22.04
    needs: build
    if: github.event_name != 'pull_request'
    permissions: 
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: SOFA-Robotics_*
          path: build
          merge-multiple: true

      - name: Get current date and time
        shell: bash
        run: echo "NOW=$(date +'%Y-%m-%dT%H:%M:%S')" >> $GITHUB_ENV
      
      - name: Create Release
        shell: bash
        env:
          RELEASE_TAG: release-${{ github.ref_name }}
          RELEASE_REPO: $GITHUB_REPOSITORY
        run: |
          echo "Uploading release ${RELEASE_TAG}"
          if gh release view "${RELEASE_TAG}" --repo "${RELEASE_REPO}" >/dev/null 2>&1; then
            gh release delete "${RELEASE_TAG}" --repo "${RELEASE_REPO}" --yes --cleanup-tag
          fi
          gh release create "${RELEASE_TAG}" build/SOFA*.zip \
            --title "SOFA-Robotics ${GITHUB_REF_NAME}" \
            --notes "Release for ${GITHUB_REF_NAME}. Last updated on ${NOW}." \
            --repo "${RELEASE_REPO}" \
            --latest
